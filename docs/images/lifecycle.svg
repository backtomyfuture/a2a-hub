<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t">
<title id="t">a2a-hub A2A 标准八态任务生命周期</title>
<defs>
<style>
svg{--bg:#faf9f5;--ink:#1d1c19;--muted:#6e6b64;--line:#d6d3cb;--card:#fff;--item:#f4f2ec;--accent:#4f46e5;--you-bg:#eef2ff;--danger:#dc2626;--danger-bg:rgba(220,38,38,0.08)}
@media (prefers-color-scheme:dark){svg{--bg:#09090b;--ink:#f4f4f5;--muted:#8b8b94;--line:#27272a;--card:#111113;--item:#18181b;--accent:#818cf8;--you-bg:rgba(99,102,241,0.12);--danger:#f87171;--danger-bg:rgba(248,113,113,0.12)}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:13.5px;fill:var(--ink)}
.s{font-size:12px;fill:var(--muted)}
.l{font-size:12.5px;font-weight:600;fill:var(--accent)}
.ld{font-size:12.5px;font-weight:600;fill:var(--danger)}
.bg{fill:var(--bg)}
.state{fill:var(--card);stroke:var(--muted);stroke-width:1.4}
.term{fill:var(--item);stroke:var(--line);stroke-width:1.4}
.term-err{fill:var(--danger-bg);stroke:var(--danger);stroke-width:1.4}
.human{fill:var(--you-bg);stroke:var(--accent);stroke-width:1.8}
.sn{font-size:15px;font-weight:700}
.sd{font-size:11.5px;fill:var(--muted)}
.conn{fill:none;stroke:var(--accent);stroke-width:1.9;marker-end:url(#a)}
.err{fill:none;stroke:var(--danger);stroke-width:1.8;marker-end:url(#c)}
.flow{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#b)}
.back{fill:none;stroke:var(--accent);stroke-width:1.7;stroke-dasharray:6 4;marker-end:url(#a)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--danger)"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="960" height="600" rx="16"/>

<!-- 上行：审批分支 -->
<rect class="human" x="300" y="76" width="196" height="64" rx="12"/>
<text x="398" y="103" class="sn" text-anchor="middle">auth-required</text>
<text x="398" y="124" class="sd" text-anchor="middle">等机主 Ed25519 签名放行</text>

<rect class="term-err" x="740" y="76" width="180" height="64" rx="12"/>
<text x="830" y="103" class="sn" text-anchor="middle">rejected</text>
<text x="830" y="124" class="sd" text-anchor="middle">审批被拒 / 越权拒收 · 终态</text>

<path class="err" d="M496 108H734"/>
<text x="615" y="96" class="ld" text-anchor="middle">机主拒绝 (deny)</text>

<!-- submitted / working <-> auth-required -->
<path class="conn" d="M168 250V108H294"/>
<text x="231" y="96" class="l" text-anchor="middle">预检策略 (always)</text>

<path class="conn" d="M446 250V146"/>
<text x="454" y="200" class="l">执行中遇高危 / risk</text>

<path class="back" d="M350 140V220H188V244"/>
<text x="342" y="200" class="l" text-anchor="end">签名批准 (approve) → 重新排队</text>

<!-- 主行 -->
<rect class="state" x="40" y="250" width="180" height="64" rx="12"/>
<text x="130" y="277" class="sn" text-anchor="middle">submitted</text>
<text x="130" y="298" class="sd" text-anchor="middle">已建单排队 · 等待认领</text>

<rect class="state" x="390" y="250" width="180" height="64" rx="12"/>
<text x="480" y="277" class="sn" text-anchor="middle">working</text>
<text x="480" y="298" class="sd" text-anchor="middle">节点认领锁定执行中</text>

<rect class="term" x="740" y="250" width="180" height="64" rx="12"/>
<text x="830" y="277" class="sn" text-anchor="middle">completed</text>
<text x="830" y="298" class="sd" text-anchor="middle">交付回执 · 终态</text>

<path class="flow" d="M220 282H384"/>
<text x="302" y="270" class="l" text-anchor="middle">claim 锁定租约</text>
<path class="flow" d="M570 282H734"/>
<text x="652" y="270" class="l" text-anchor="middle">complete 完成</text>

<!-- 下行：取消、追问、失败 -->
<rect class="term" x="40" y="420" width="180" height="64" rx="12"/>
<text x="130" y="447" class="sn" text-anchor="middle">canceled</text>
<text x="130" y="468" class="sd" text-anchor="middle">机主 / 发起方取消 · 终态</text>
<path class="flow" d="M130 314V414"/>
<text x="140" y="368" class="l">主动撤单 (cancel)</text>

<rect class="human" x="390" y="420" width="180" height="64" rx="12"/>
<text x="480" y="447" class="sn" text-anchor="middle">input-required</text>
<text x="480" y="468" class="sd" text-anchor="middle">阻塞追问 · 等补充说明</text>
<path class="conn" d="M506 314V414"/>
<text x="514" y="368" class="l">ask 追问</text>
<path class="back" d="M454 420V356H202V320"/>
<text x="328" y="346" class="l" text-anchor="middle">reply 回复 → 恢复排队</text>

<rect class="term-err" x="740" y="420" width="180" height="64" rx="12"/>
<text x="830" y="447" class="sn" text-anchor="middle">failed</text>
<text x="830" y="468" class="sd" text-anchor="middle">失败超限 / 不可重试 · 终态</text>
<path class="err" d="M570 300H650V452H734"/>
<text x="658" y="382" class="ld">fail 超限</text>

<text x="480" y="542" class="s" text-anchor="middle">终态不可变：completed / failed / canceled / rejected 不再迁移，后续追派在同一 context_id 下新建子任务</text>
<text x="480" y="566" class="s" text-anchor="middle">working 可重试失败或超过 STALE_MIN (20 分钟) 未续租约 → 自动退避回到 submitted（重试上限 MAX_RETRIES=2）</text>
</svg>
