<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" role="img" aria-labelledby="t">
<title id="t">v2.0 多节点并发扇出与 Context_ID 多轮协同</title>
<defs>
<style>
svg{--bg:#faf9f5;--ink:#1d1c19;--muted:#6e6b64;--line:#d6d3cb;--card:#fff;--item:#f4f2ec;--accent:#4f46e5}
@media (prefers-color-scheme:dark){svg{--bg:#09090b;--ink:#f4f4f5;--muted:#8b8b94;--line:#27272a;--card:#111113;--item:#18181b;--accent:#818cf8}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:13.5px;fill:var(--ink)}
.h2{font-size:16px;font-weight:700}
.s{font-size:12px;fill:var(--muted)}
.bg{fill:var(--bg)}
.plug{fill:var(--card);stroke:var(--line);stroke-width:1.4}
.item{fill:var(--item);stroke:var(--line)}
.sn{font-size:14.5px;font-weight:700}
.sd{font-size:11.5px;fill:var(--muted)}
.badge{fill:var(--accent)}
.n{font-size:12px;font-weight:700;fill:#fff}
.flow{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#b)}
</style>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="960" height="284" rx="16"/>
<rect class="plug" x="22" y="22" width="916" height="240" rx="14"/>
<text x="40" y="56" class="h2">多节点并行扇出与多轮续接</text>
<text x="262" y="56" class="s">同一 Context_ID 下并行派发给本机 CLI 与云端 Agent，汇总至单一对话线程</text>

<rect class="item" x="40" y="84" width="200" height="110" rx="10"/>
<circle class="badge" cx="64" cy="84" r="12"/>
<text x="64" y="88.5" class="n" text-anchor="middle">1</text>
<text x="64" y="120" class="sn">扇出建单</text>
<text x="64" y="144" class="sd">控制台或 Leader 指定</text>
<text x="64" y="164" class="sd">to: [mac--claude, grok-bot]</text>

<path class="flow" d="M242 139H258"/>

<rect class="item" x="262" y="84" width="200" height="110" rx="10"/>
<circle class="badge" cx="286" cy="84" r="12"/>
<text x="286" y="88.5" class="n" text-anchor="middle">2</text>
<text x="286" y="120" class="sn">跨端并发执行</text>
<text x="286" y="144" class="sd">Mac 并发池跑代码与单测</text>
<text x="286" y="164" class="sd">云端 Bot 同步检索资料</text>

<path class="flow" d="M464 139H480"/>

<rect class="item" x="484" y="84" width="200" height="110" rx="10"/>
<circle class="badge" cx="508" cy="84" r="12"/>
<text x="508" y="88.5" class="n" text-anchor="middle">3</text>
<text x="508" y="120" class="sn">前情汇集与续接</text>
<text x="508" y="144" class="sd">同 context_id 追派注入前情</text>
<text x="508" y="164" class="sd">本地 CLI 自动 --resume 续跑</text>

<path class="flow" d="M686 139H702"/>

<rect class="item" x="706" y="84" width="200" height="110" rx="10"/>
<circle class="badge" cx="730" cy="84" r="12"/>
<text x="730" y="88.5" class="n" text-anchor="middle">4</text>
<text x="730" y="120" class="sn">线程收口与通知</text>
<text x="730" y="144" class="sd">Web 对话线程集中检视产物</text>
<text x="730" y="164" class="sd">按需推送飞书 / Bark / Telegram</text>

<text x="480" y="234" class="s" text-anchor="middle">高危操作经 Ed25519 私钥签名放行 · 全部状态变迁写入不可变 messages 时间线</text>
</svg>
